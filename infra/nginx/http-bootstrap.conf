server {
 listen 8080;
 server_name _;
 client_max_body_size 10m;
 location = /nginx-health { return 200 'ok'; add_header Content-Type text/plain; }
 location /.well-known/acme-challenge/ { root /var/www/certbot; }
 location /api/ { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 150s; proxy_buffering off; }
 location / { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
