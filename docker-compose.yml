services:
  web:
    image: ${WEB_IMAGE:-finsight-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    environment:
      API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  api:
    image: ${API_IMAGE:-finsight-api:local}
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    environment: { NODE_ENV: production, PORT: '4000', NODE_OPTIONS: '--max-old-space-size=512' }
    restart: unless-stopped
    mem_limit: 704m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
    logging: *logging
  nginx:
    image: nginx:stable-bookworm
    ports: ['80:8080', '443:8443']
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certbot/www:/var/www/certbot:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      web: {condition: service_healthy}
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 96m
    healthcheck:
      test: [CMD-SHELL, 'nginx -t && curl --fail --silent --output /dev/null http://127.0.0.1:8080/nginx-health']
      interval: 30s
      timeout: 5s
    logging: *logging
